name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - name: Offline example
        run: |
          python -m jobbot --config examples/demo.toml --snapshot examples/baseline.json --database /tmp/vacancy-demo.sqlite
          python -m jobbot --config examples/demo.toml --snapshot examples/new.json --database /tmp/vacancy-demo.sqlite
